services:
  worker:
    build: .
    image: ci-vimeo-worker:latest
    container_name: ci-vimeo-worker
    restart: unless-stopped
    command: ["sleep", "infinity"]
    env_file:
      - .env
    environment:
      VIMEO_MIGRATION_EXECUTE: "${VIMEO_MIGRATION_EXECUTE:-1}"
      VIMEO_MIGRATION_PROCESS: "${VIMEO_MIGRATION_PROCESS:-1}"
      VIMEO_MIGRATION_TRANSFER_MODE: "${VIMEO_MIGRATION_TRANSFER_MODE:-local-file}"
      VIMEO_MIGRATION_QUEUE_CACHE: "${VIMEO_MIGRATION_QUEUE_CACHE:-1}"
      VIMEO_MIGRATION_REFRESH_QUEUE: "${VIMEO_MIGRATION_REFRESH_QUEUE:-0}"
      VIMEO_MIGRATION_SKIP_SUBFOLDER_DISCOVERY: "${VIMEO_MIGRATION_SKIP_SUBFOLDER_DISCOVERY:-1}"
      VIMEO_MIGRATION_INCLUDE_ROOT: "${VIMEO_MIGRATION_INCLUDE_ROOT:-0}"
      VIMEO_MIGRATION_VIDEO_CONCURRENCY: "${VIMEO_MIGRATION_VIDEO_CONCURRENCY:-4}"
      VIMEO_MIGRATION_HLS_CONCURRENCY: "${VIMEO_MIGRATION_HLS_CONCURRENCY:-1}"
      VIMEO_MIGRATION_PIPELINE_HLS: "${VIMEO_MIGRATION_PIPELINE_HLS:-1}"
      VIMEO_MIGRATION_HLS_BACKLOG_LIMIT: "${VIMEO_MIGRATION_HLS_BACKLOG_LIMIT:-8}"
      VIMEO_MIGRATION_NOTIFY: "${VIMEO_MIGRATION_NOTIFY:-0}"
      VIDEO_HLS_ENCODER: "${VIDEO_HLS_ENCODER:-libx264}"
      VIDEO_HLS_X264_PRESET: "${VIDEO_HLS_X264_PRESET:-veryfast}"
      VIDEO_HLS_X264_CRF: "${VIDEO_HLS_X264_CRF:-23}"
      VIDEO_HLS_UPLOAD_CONCURRENCY: "${VIDEO_HLS_UPLOAD_CONCURRENCY:-2}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/tmp/ci-vimeo-worker
    cpus: "5.0"
    mem_limit: 12g
